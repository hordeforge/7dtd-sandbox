---
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this job needs no token access.
permissions:
  contents: read

# One run per ref, so an intermediate PR push does not keep burning runner
# minutes behind its successors.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Bounds a hung step (the default is 6 hours). `make test` is pure shell
    # and stdlib Python against temp dirs, so it finishes in seconds.
    timeout-minutes: 10
    steps:
      # Pinned to the release commit, not the mutable v7 tag: a moved tag
      # would otherwise run unreviewed code here with the workflow token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The analyzers `make check` runs, at the version the Makefile pins. The
      # workflow reads RUFF_VERSION, SHELLCHECK_VERSION, SHELLCHECK_PY_VERSION
      # and YAMLLINT_VERSION out of the Makefile rather than repeating the
      # numbers, so a bump is one edit and the two cannot disagree
      # (scripts/test_sb_cli.sh holds that agreement on every push).
      #
      # They are tools, not dependencies of the shipped code: nothing under
      # scripts/ imports any of them, and the game images carry none. They are
      # pinned for the same reason the checkout above is pinned to a release
      # commit: a version nobody chose is a version nobody reviewed, and a
      # runner's preinstalled analyzer is exactly that (it moves with the
      # runner image). shellcheck-py is the distribution channel: it ships the
      # pinned ShellCheck binary as a `shellcheck` script, so the shell half of
      # the gate is pinned the same way the Python half is.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Install the pinned analyzers (the ones make check requires)
        run: |
          ruff_version="$(sed -n 's/^RUFF_VERSION := //p' Makefile | head -1)"
          shellcheck_py_version="$(sed -n 's/^SHELLCHECK_PY_VERSION := //p' Makefile | head -1)"
          yamllint_version="$(sed -n 's/^YAMLLINT_VERSION := //p' Makefile | head -1)"
          if [ -z "$ruff_version" ] || [ -z "$shellcheck_py_version" ] || [ -z "$yamllint_version" ]; then
            echo "ERROR: the Makefile no longer pins RUFF/SHELLCHECK_PY/YAMLLINT versions" >&2
            exit 1
          fi
          uv tool install "ruff==$ruff_version"
          uv tool install "shellcheck-py==$shellcheck_py_version"
          uv tool install "yamllint==$yamllint_version"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          shellcheck --version
          ruff --version
          yamllint --version
          test "$(shellcheck --version | awk '/^version:/{print $2}')" \
            = "$(sed -n 's/^SHELLCHECK_VERSION := //p' Makefile | head -1)"

      # Through make, never an inline copy, so CI cannot drift from dev
      # (REPOSITORY_STANDARDS.md section 5). `check` is the static verdict
      # (bash -n, shellcheck, ruff check, ruff format --check, python
      # compile); `test` adds every scripts/test_*.sh and
      # scripts/test_*.py.
      #
      # No game, no Proton and no steamcmd: every gate works against a temp
      # SANDBOX_HOME with fake bases, which is what keeps the instance contract
      # (name-derived ports, declared admins, a serverconfig rebuilt from its
      # base template, a detached `sb up`) testable on a hosted runner at all.
      #
      # There is no dependency install step for the shipped code and no
      # lockfile: this repository is bash plus the Python standard library.
      # The one install above is the analyzer, and it is version-pinned here.
      # Adding a dependency means adding a locked install in the same change.
      - name: Static verdict and gates (make check test)
        run: make check test

      # The entry point as a consumer invokes it, not just the source tree: a
      # sibling harness shells out to `sb`, so a broken dispatch must fail here
      # rather than in that harness. `version` is the release manifest the tag
      # gate checks; `help` and `list` are the surface every consumer starts at.
      - name: Exercise the installed entry point
        run: |
          set -euo pipefail
          test "$(./scripts/sb version)" = "sb $(sed -n 's/^SB_VERSION="\([^"]*\)".*/\1/p' scripts/sb)"
          ./scripts/sb help >/dev/null
          ./scripts/sb list >/dev/null
          ./scripts/sb doctor >/dev/null || true  # reports readiness; a bare runner has no base
