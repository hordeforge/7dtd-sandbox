# Static analysis for the Python half of this repository. `make check` runs
# `ruff check` and `ruff format --check`; CI runs `make check`, so a finding
# here is a red build rather than a line somebody reads one day.
#
# Bash is covered by shellcheck (.shellcheckrc). Python was previously covered
# by `python -m compileall`, which only proves the file parses.
# The floor the code actually supports, not the interpreter it happens to run
# on here: `sbconfig.py` refuses anything below MIN_PYTHON = (3, 8), and
# `scripts/sb` mirrors it. A newer target lets pyupgrade suggest syntax the
# floor cannot parse (PEP 695 type parameters, say), which is a green build
# that ships a SyntaxError to every supported host.
target-version = "py38"

# The tree's own cap: the longest line in scripts/*.py is 96, so nothing here
# is reformatted to satisfy a number chosen for the tool.
line-length = 100

[lint]
# Correctness and maintenance rules, with the analyzer's own groups rather
# than hand-written equivalents. Style-only and opinionated groups (D, COM,
# T20, CPY, N, ARG, EM) stay off: they encode preferences this tree does not
# follow, and a rule that fires on every line gets ignored. A and ANN are on
# because shadowing a builtin and leaving a parameter unannotated are defects
# rather than preferences, and the tree already annotates every signature.
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RET",  # return consistency
    "PIE",  # misc lints
    "RUF",  # ruff-specific
    "S",    # bandit
    "TID",  # tidy imports
    "PL",   # pylint
    "TRY",  # exception handling
    "PTH",  # pathlib
    "FURB", # refactor
    "PERF", # perflint
    "G",    # logging format
    "EXE",  # shebang/executable agreement
    "ISC",  # implicit string concat
    "ICN",  # import conventions
    "RSE",  # raise
    "PT",   # pytest style
    "A",    # shadowing a builtin (id, type, list) is a defect, not a style
    "ASYNC", # blocking a loop or a def, and an async call with no await
    "BLE",  # blind except: catches a defect class it was not written for
    "DTZ",  # a naive datetime that compares wrong across a DST boundary
    "ERA",  # commented-out code, which rots and reads like live code
    "INP",  # an implicit namespace package, which breaks the install
    "ANN",  # an unannotated parameter or return, so a gap is a red build
]
# A message built at the raise site is the point in a two-hundred-line CLI:
# moving it to a bespoke exception class per case would be noise.
ignore = [
    "TRY003",
]

[lint.per-file-ignores]
# The gates are plain scripts driven by `make test`, not a pytest suite, and
# they assert with `assert` and report with `print` because that is how the
# other gates in scripts/test_*.sh report too.
#
# S314 and PLR2004 are off because the paths and XML a gate names are text it
# reads out of another file or renders into a temp dir, not input from
# anywhere untrusted, and in a gate the literals are the data: a fuzz corpus's
# shape weights and an asserted exit code are what the case is, and naming each
# one would only move the number somewhere else. S108 and S311 are not listed
# here: the two lines that need them carry their own `noqa`, with the reason on
# the line above, which is where a one-file exception belongs.
#
# BLE001 is off here for the same reason it is on everywhere else: a gate that
# lets an unexpected exception escape abandons every case after it and the
# reader cannot tell which one never ran. Each of the five sites is a runner
# reporting a raising case as a finding. The shipped renderer, sbconfig.py,
# catches nothing it did not name, and that is what the rule is there to keep.
"scripts/test_*.py" = [
    "S101",
    "S314",
    "S603",
    "S607",
    "T201",
    "BLE001",
    "PLC",
    "PLR2004",
    "PT",
]
# S314 wants defusedxml for every ElementTree parse. The only parse left is
# _wellformed()'s "would an XML parser accept this serveradmin.xml at all",
# over a file the sandbox itself wrote a moment earlier. It is the same
# reasoning as the test-script entry above, on the other side of the render.
"scripts/sbconfig.py" = ["S314"]

[format]
docstring-code-format = false
